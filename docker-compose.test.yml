name: property-desk-test

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+ images store data directly under /var/lib/postgresql (versioned
      # subdirectories), not /var/lib/postgresql/data — mounting the old path crash-loops.
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - property-desk-test
    # Deliberately no `ports:` — Postgres is reachable only from the app on the
    # private network, never from the host or the public internet.

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TAG: ${GIT_TAG:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: property-desk:${GIT_TAG:-latest}-test
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Bound to loopback: a reverse proxy on this VM connects via localhost.
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - property-desk-test

networks:
  property-desk-test:

volumes:
  postgres_test_data:
